name: Core Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number containing the commit
        required: true
        type: string
      commit_sha:
        description: Exact reviewed 40-character PR head commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  leia-tests:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        leia-test:
          - badname
          - build
          - c,o,m,m,a
          - cache
          - certs
          - command
          - config
          - debug
          - envfile
          - entrypoint
          # - environment
          - events
          - excludes
          - exec
          - experimental
          - healthcheck
          - host
          # - hostnames
          - info
          - init-github
          - init-remote
          - keys
          - l337
          - lando-v4
          - landofile
          - landofile-custom
          - list
          - logs
          - long-name
          - mounts
          - networking
          - no-services
          - orchestrator
          - plugins
          - proxy
          - rebuild
          - renderer
          - recipes
          - release-channel
          - restart
          - scanner
          - security
          - sluggy
          - sql-helpers
          - ssh
          # - storage
          - tooling
          - update
          - version
          - yaml
        node-version:
          - "20"
        os:
          # - macos-15
          - ubuntu-24.04
          # - windows-2022
        shell:
          - bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install SSH key
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace
      - name: Generate test SSH key
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_rsa
      - name: Install node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Bundle Deps
        uses: lando/prepare-release-action@v3
        with:
          lando-plugin: true
          version: dev
          sync: false
      - name: Install pkg dependencies
        run: npm clean-install --prefer-offline --frozen-lockfile --production
      - name: Package into node binary
        uses: lando/pkg-action@v6
        id: pkg-action
        with:
          entrypoint: bin/lando
          filename: lando
          node-version: ${{ matrix.node-version }}
          options: --options dns-result-order=ipv4first
          upload: false
          pkg: "@yao-pkg/pkg@5.16.1"
      - name: Install full deps
        run: npm clean-install --prefer-offline --frozen-lockfile
      - name: Setup lando ${{ steps.pkg-action.outputs.file }}
        uses: lando/setup-lando@v3
        with:
          lando-version: ${{ steps.pkg-action.outputs.file }}
          telemetry: false
          config: |
            setup.skipCommonPlugins=true
      - name: Run Leia Tests
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository ||
          !contains(fromJSON('["l337", "lando-v4"]'), matrix.leia-test)
        uses: lando/run-leia-action@v2
        with:
          leia-test: "./examples/${{ matrix.leia-test }}/README.md"
          cleanup-header: "Destroy tests"
          shell: ${{ matrix.shell }}
          stdin: true

  privileged-leia-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        leia-test:
          - l337
          - lando-v4
    env:
      TERM: xterm
    steps:
      - name: Resolve and validate pull request commit
        id: resolve
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pull_request must be a pull request number"
            exit 1
          fi
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be an exact 40-character commit SHA"
            exit 1
          fi
          PR_HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.sha)
          PR_HEAD_REPO=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq .head.repo.full_name)
          if [[ "$COMMIT_SHA" != "$PR_HEAD_SHA" ]]; then
            echo "commit_sha does not match the current head of pull request #$PR_NUMBER"
            exit 1
          fi
          echo "repository=$PR_HEAD_REPO" >> "$GITHUB_OUTPUT"
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.resolve.outputs.repository }}
          ref: ${{ inputs.commit_sha }}
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace
      - name: Install node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Bundle Deps
        uses: lando/prepare-release-action@v3
        with:
          lando-plugin: true
          version: dev
          sync: false
      - name: Install pkg dependencies
        run: npm clean-install --prefer-offline --frozen-lockfile --production
      - name: Package into node binary
        uses: lando/pkg-action@v6
        id: pkg-action
        with:
          entrypoint: bin/lando
          filename: lando
          node-version: "20"
          options: --options dns-result-order=ipv4first
          upload: false
          pkg: "@yao-pkg/pkg@5.16.1"
      - name: Install full deps
        run: npm clean-install --prefer-offline --frozen-lockfile
      - name: Setup lando ${{ steps.pkg-action.outputs.file }}
        uses: lando/setup-lando@v3
        with:
          lando-version: ${{ steps.pkg-action.outputs.file }}
          telemetry: false
          config: |
            setup.skipCommonPlugins=true
      - name: Run Leia Tests
        uses: lando/run-leia-action@v2
        with:
          leia-test: "./examples/${{ matrix.leia-test }}/README.md"
          cleanup-header: "Destroy tests"
          shell: bash
          stdin: true
