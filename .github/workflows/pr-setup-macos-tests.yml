name: Setup macOS Tests

on:
  pull_request:

jobs:
  leia-tests:
    runs-on: ${{ matrix.os }}
    env:
      TERM: xterm
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
        os:
          - macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Bundle Deps
        uses: lando/prepare-release-action@v3
        with:
          lando-plugin: true
          version: dev
          sync: false
      - name: Install pkg dependencies
        run: npm clean-install --prefer-offline --frozen-lockfile --production
      - name: Package into node binary
        uses: lando/pkg-action@v6
        id: pkg-action
        with:
          entrypoint: bin/lando
          filename: lando
          node-version: ${{ matrix.node-version }}
          options: --options dns-result-order=ipv4first
          upload: false
          pkg: "@yao-pkg/pkg@5.16.1"
      - name: Install full deps
        run: npm clean-install --prefer-offline --frozen-lockfile
      - name: Setup lando ${{ steps.pkg-action.outputs.file }}
        uses: lando/setup-lando@v3
        with:
          auto-setup: false
          lando-version: ${{ steps.pkg-action.outputs.file }}
          telemetry: false
      - name: Get default Docker Desktop version
        id: docker-desktop
        run: echo "version=$(node -p \"require('./utils/get-config-defaults')({}).setup.buildEngine\")" >> "$GITHUB_OUTPUT"
      - name: Install Docker Desktop ${{ steps.docker-desktop.outputs.version }}
        run: |
          brew uninstall --force --ignore-dependencies docker-desktop
          lando setup -y --skip-networking --skip-common-plugins --build-engine ${{ steps.docker-desktop.outputs.version }}
      - name: Verify Docker Desktop ${{ steps.docker-desktop.outputs.version }}
        run: test "$(defaults read /Applications/Docker.app/Contents/Info CFBundleShortVersionString)" = "${{ steps.docker-desktop.outputs.version }}"
      - name: Verify lando setup
        uses: lando/run-leia-action@v2
        with:
          leia-test: "./examples/setup-macos/README.md"
          cleanup-header: "Destroy tests"
          shell: bash
          stdin: true
      - name: Run Docker Desktop smoke tests
        uses: lando/run-leia-action@v2
        with:
          leia-test: "./examples/desktop-smoke/README.md"
          cleanup-header: "Destroy tests"
          shell: bash
          stdin: true
